node_user: hyperliquid

chain: Mainnet # Options: Mainnet, Testnet

testnet_visor_binary_url: https://binaries.hyperliquid-testnet.xyz/Testnet/hl-visor
mainnet_visor_binary_url: https://binaries.hyperliquid.xyz/Mainnet/hl-visor
pub_key_url: https://raw.githubusercontent.com/hyperliquid-dex/node/refs/heads/main/pub_key.asc
mainnet_signature_url: https://binaries.hyperliquid.xyz/Mainnet/hl-visor.asc
testnet_signature_url: https://binaries.hyperliquid-testnet.xyz/Testnet/hl-visor.asc

gossip_config:
  download_peers: true # get list of recent active peers from HL API. overrides 'ip' list below if true
  try_new_peers: true
  ip: []

visor:
  exec_start: |
    /home/{{node_user}}/hl-visor run-non-validator --write-fills --write-hip3-oracle-updates --write-misc-events --write-system-and-core-writer-actions --replica-cmds-style=actions-and-responses
  restart_sec: 5

pruner:
  data_path: /home/{{ node_user }}/hl/data
  enabled: true
  cron_schedule: "0 * * * *"
  retain_hours: 4

edge_sync:
  enabled: false
  targets: []
  lock_path: /tmp/hl-edge-sync.lock
  config_path: /etc/hl-edge-sync.yml
  script_path: /usr/local/bin/hl-edge-sync.py
  service_name: hl-edge-sync
  sync_items:
    - name: node_fills
      type: directory
      source: /home/{{ node_user }}/hl/data/node_fills/
      destination: /srv/public_data/node_fills/
      delete: true
    - name: periodic_abci_states_today
      type: latest_by_name
      source: /home/{{ node_user }}/hl/data/periodic_abci_states
      destination: /srv/public_data/periodic_abci_states
      date_subdir: true
      pattern: "*.rmp"
      delete: true
    - name: hip3_oracle_updates
      type: directory
      source: /home/{{ node_user }}/hl/data/hip3_oracle_updates/hourly
      destination: /srv/public_data/hip3_oracle_updates
      date_subdir: true
      delete: true
    - name: system_and_core_writer_actions
      type: directory
      source: /home/{{ node_user }}/hl/data/system_and_core_writer_actions/hourly
      destination: /srv/public_data/system_and_core_writer_actions
      date_subdir: true
      delete: true
  timer_on_boot_sec: 2min
  timer_on_unit_active_sec: 5min
  timer_accuracy_sec: 30s
  timeout_start_sec: 30min
  run_on_deploy: false

clickhouse:
  enabled: false
  image: clickhouse/clickhouse-server:24.8
  container_name: clickhouse
  restart_policy: unless-stopped
  # Host interface the container ports are published on. Loopback only by
  # default so ClickHouse is never reachable over the external network.
  bind_host: 127.0.0.1
  http_port: 8123
  native_port: 9000
  listen_host: 0.0.0.0
  data_dir: /var/lib/clickhouse-docker
  config_dir: /etc/clickhouse-docker
  user: default
  password: ""
  db: default
  create_database: true
  max_server_memory_usage: 0
  memory_limit: "0"
  ulimit_nofile: 262144
  metrics:
    enabled: true
    endpoint: /metrics
    port: 9363
    include_metrics: true
    include_events: true
    include_asynchronous_metrics: true
    scrape: true
    job_name: clickhouse
    # Defaults to monitoring.docker_network.
    docker_network: "{{ monitoring.docker_network | default('monitoring') }}"
    docker_network_driver: bridge

monitoring:
  enabled: false
  docker_network: monitoring
  docker_network_driver: bridge

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart_policy: unless-stopped
    publish: true
    # Published only on loopback by default. Use nginx or an SSH tunnel for access.
    bind_host: 127.0.0.1
    port: 9090
    # Lets Prometheus scrape host services as host.docker.internal:<port>.
    etc_hosts:
      host.docker.internal: host-gateway
    config_dir: /etc/prometheus-docker
    data_dir: /var/lib/prometheus-docker
    retention_time: 15d
    retention_size: ""
    scrape_interval: 15s
    evaluation_interval: 15s
    # Compatible with the nginx role's /prometheus/ path proxy.
    external_url: /prometheus/
    route_prefix: /
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    extra_args: []
    extra_scrape_configs: []

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart_policy: unless-stopped
    publish: true
    # Published only on loopback by default. Use nginx or an SSH tunnel for access.
    bind_host: 127.0.0.1
    port: 3000
    data_dir: /var/lib/grafana-docker
    provisioning_dir: /etc/grafana-docker/provisioning
    admin_user: admin
    # Override before exposing Grafana.
    admin_password: admin
    allow_sign_up: false
    anonymous_enabled: false
    # Set to the public hostname used by nginx.
    domain: localhost
    # Compatible with the nginx role's /grafana/ path proxy.
    root_url: "%(protocol)s://%(domain)s/grafana/"
    serve_from_sub_path: true
    install_plugins: []
    hide_secrets: true
    datasource:
      name: Prometheus
      uid: prometheus
      url: http://prometheus:9090
      is_default: true
    dashboards:
      enabled: true
      provider_name: Node
      folder: ""
      allow_ui_updates: true
      default_node_dashboard: true

  node_exporter:
    enabled: true
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart_policy: unless-stopped
    job_name: node
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    published_ports: []

caddy:
  enabled: false
  package_name: caddy
  service_name: caddy
  config_path: /etc/caddy/Caddyfile

  monitoring:
    grafana:
      enabled: true
      # Set to the public hostname for Grafana (e.g. grafana.example.com).
      domain: ""
      proxy_pass: http://127.0.0.1:3000
