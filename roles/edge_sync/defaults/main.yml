edge_sync:
  enabled: false
  targets: []
  lock_path: /tmp/hl-edge-sync.lock
  script_path: /usr/local/bin/hl-edge-sync.sh
  service_name: hl-edge-sync
  sync_items:
    - name: node_fills
      type: directory
      source: /home/{{ node_user }}/hl/data/node_fills/
      destination: /srv/public_data/node_fills/
      delete: true
    - name: periodic_abci_states_today
      type: latest_by_name
      source: /home/{{ node_user }}/hl/data/periodic_abci_states
      destination: /srv/public_data/periodic_abci_states
      date_subdir: true
      pattern: "*.rmp"
      delete: true
  timer_on_boot_sec: 2min
  timer_on_unit_active_sec: 5min
  timer_accuracy_sec: 30s
  timeout_start_sec: 30min
  run_on_deploy: false
