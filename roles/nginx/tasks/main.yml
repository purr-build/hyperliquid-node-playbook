---
- name: Merge nginx settings onto defaults
  ansible.builtin.set_fact:
    nginx: "{{ nginx_defaults | combine(nginx | default({}), recursive=True) }}"

- name: Install nginx
  become: true
  when: nginx.enabled | bool
  ansible.builtin.apt:
    name: "{{ nginx.package_name }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure nginx site directories exist
  become: true
  when: nginx.enabled | bool
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx.sites_available_dir }}"
    - "{{ nginx.sites_enabled_dir }}"

- name: Remove default nginx site
  become: true
  when:
    - nginx.enabled | bool
    - nginx.remove_default_site | bool
  ansible.builtin.file:
    path: "{{ nginx.sites_enabled_dir }}/default"
    state: absent
  notify: Reload nginx

- name: Render monitoring nginx site
  become: true
  when:
    - nginx.enabled | bool
    - nginx.monitoring.enabled | bool
  ansible.builtin.template:
    src: monitoring.conf.j2
    dest: "{{ nginx.sites_available_dir }}/{{ nginx.monitoring.site_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable monitoring nginx site
  become: true
  when:
    - nginx.enabled | bool
    - nginx.monitoring.enabled | bool
  ansible.builtin.file:
    src: "{{ nginx.sites_available_dir }}/{{ nginx.monitoring.site_name }}.conf"
    dest: "{{ nginx.sites_enabled_dir }}/{{ nginx.monitoring.site_name }}.conf"
    state: link
    force: true
  notify: Reload nginx

- name: Disable monitoring nginx site
  become: true
  when:
    - nginx.enabled | bool
    - not (nginx.monitoring.enabled | bool)
  ansible.builtin.file:
    path: "{{ nginx.sites_enabled_dir }}/{{ nginx.monitoring.site_name }}.conf"
    state: absent
  notify: Reload nginx

- name: Test nginx configuration
  become: true
  when: nginx.enabled | bool
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  become: true
  when: nginx.enabled | bool
  ansible.builtin.service:
    name: "{{ nginx.service_name }}"
    enabled: true
    state: started
